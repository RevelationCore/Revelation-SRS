name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:

  # ── 1. Typecheck + Lint ────────────────────────────────────────────────────
  typecheck-and-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Clock-use check (no raw new Date / Date.now in api/src)
        run: |
          if grep -rn --include='*.ts' 'new Date()\|Date\.now()' apps/api/src/ | grep -v '// clock:allow' | grep -v 'src/platform/clock\.ts'; then
            echo "ERROR: raw new Date() or Date.now() found in apps/api/src/ without // clock:allow"
            exit 1
          fi
          echo "Clock check passed"

  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm --filter @revelation-srs/api vitest run --coverage
        env:
          DATABASE_URL: postgres://srs:srs@localhost:5432/srs
          JWT_SECRET:   test-secret

      - name: Run unit tests (all other packages)
        run: pnpm --filter '!@revelation-srs/api' test
        env:
          DATABASE_URL: postgres://srs:srs@localhost:5432/srs
          JWT_SECRET:   test-secret

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: apps/api/coverage/
          retention-days: 14

  # ── 3. Integration tests (Testcontainers) ─────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run integration tests (Testcontainers — Docker required)
        run: pnpm test:int
        env:
          DATABASE_URL: postgres://srs:srs@localhost:5432/srs
          JWT_SECRET:   test-secret
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ── 4. Container image build + vulnerability scan ─────────────────────────
  container-build:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    infra/docker/api/Dockerfile
          push:    false
          tags:    revelation-srs/api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy scan — API
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:     revelation-srs/api:${{ github.sha }}
          format:        table
          exit-code:     "1"
          severity:      CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    infra/docker/portal/Dockerfile
          push:    false
          tags:    revelation-srs/portal:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy scan — Portal
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:     revelation-srs/portal:${{ github.sha }}
          format:        table
          exit-code:     "1"
          severity:      CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    infra/docker/admin/Dockerfile
          push:    false
          tags:    revelation-srs/admin:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Trivy scan — Admin
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref:     revelation-srs/admin:${{ github.sha }}
          format:        table
          exit-code:     "1"
          severity:      CRITICAL,HIGH
          ignore-unfixed: true

      # ── SBOM generation (syft / SPDX 2.3) ──────────────────────────────────
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: SBOM — API
        uses: anchore/sbom-action@v0
        with:
          image:         revelation-srs/api:${{ github.sha }}
          artifact-name: sbom-api-${{ github.sha }}.spdx.json
          output-file:   ./sbom-api.spdx.json
          format:        spdx-json

      - name: SBOM — Portal
        uses: anchore/sbom-action@v0
        with:
          image:         revelation-srs/portal:${{ github.sha }}
          artifact-name: sbom-portal-${{ github.sha }}.spdx.json
          output-file:   ./sbom-portal.spdx.json
          format:        spdx-json

      - name: SBOM — Admin
        uses: anchore/sbom-action@v0
        with:
          image:         revelation-srs/admin:${{ github.sha }}
          artifact-name: sbom-admin-${{ github.sha }}.spdx.json
          output-file:   ./sbom-admin.spdx.json
          format:        spdx-json

      - name: Upload SBOM artefacts
        uses: actions/upload-artifact@v4
        with:
          name:              sbom-${{ github.sha }}
          path:              "*.spdx.json"
          retention-days:    30

  # ── 5. OpenAPI contract validation ────────────────────────────────────────
  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Generate OpenAPI spec
        run: pnpm --filter @revelation-srs/api generate:openapi

      - name: Generate compatibility report
        run: pnpm --filter @revelation-srs/api generate:compat-report

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compat-report-${{ github.sha }}
          path: apps/api/openapi/compat-report.json
          retention-days: 30

  # ── 6. Contract tests ──────────────────────────────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run Stage 1–3 and Stage 6 contract tests (no DB required)
        run: >
          pnpm --filter @revelation-srs/api vitest run
          --reporter=verbose
          --config vitest.int.config.ts
          test/stage1-openapi-contract.int.test.ts
          test/stage2-event-schema-registry.int.test.ts
          test/stage3-file-contract-specs.int.test.ts
          test/stage6-contract-tests.int.test.ts
        env:
          JWT_SECRET: test-secret

  # ── 7. Frontend smoke tests (Playwright + axe) ───────────────────────────
  frontend-smoke:
    name: Frontend Smoke & Accessibility
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  # ── 8. Frontend performance budget check ─────────────────────────────────
  frontend-bundle-size:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        run: pnpm --filter @revelation-srs/portal build && pnpm --filter @revelation-srs/admin build

      - name: Check bundle size budgets
        run: pnpm check:bundle-size

  # ── 10. Frontend OpenAPI types drift check ───────────────────────────────
  frontend-types-drift:
    name: Frontend API Types Drift
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check API types are up to date
        run: pnpm check:types-drift

  # ── 9. Lighthouse CI (portal performance budgets) ────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm --filter @revelation-srs/portal build

      - name: Run Lighthouse CI
        run: |
          pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ── 10. Golden full-stack E2E ─────────────────────────────────────────────
  golden-e2e:
    name: Golden E2E
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Build frontend apps
        run: pnpm --filter @revelation-srs/portal build && pnpm --filter @revelation-srs/admin build

      - name: Run golden full-stack E2E
        run: pnpm test:e2e:golden
        env:
          DATABASE_URL:            postgres://srs:srs@localhost:5432/srs
          JWT_SECRET:              test-secret
          DEMO_DATA_ENABLED:       "true"
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload golden E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-e2e-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # ── 11. npm audit ────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
