global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: srs-api
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics

  - job_name: nats
    static_configs:
      - targets: ['nats:8222']
    metrics_path: /metrics

  - job_name: temporal
    static_configs:
      - targets: ['temporal:9090']
