---
# ── Temporal — Production Configuration ──────────────────────────────────────
#
# Temporal production deployment uses the official `temporalio/temporal` image
# (not `temporalio/auto-setup`, which is for local development only).
#
# RECOMMENDED: Use the official Temporal Helm chart for production:
#   https://github.com/temporalio/helm-charts
#
#   helm repo add temporal https://go.temporal.io/server/releases/temporal-helm-charts
#   helm install temporal temporal/temporal \
#     --set server.replicaCount=1 \
#     --set cassandra.enabled=false \
#     --set mysql.enabled=false \
#     --set postgresql.enabled=false \
#     --set server.config.persistence.default.driver=sql \
#     --set server.config.persistence.default.sql.driver=postgres12 \
#     --set server.config.persistence.default.sql.host=postgres \
#     --set server.config.persistence.default.sql.database=temporal \
#     --set server.config.persistence.default.sql.user=temporal \
#     --set server.config.persistence.default.sql.password=<from-openbao>
#
# The manifests below provide a standalone deployment suitable for staging.
# For production, the Helm chart is preferred for lifecycle management.

---
# ── Temporal — ConfigMap ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-temporal-config
  namespace: revelation-srs
data:
  config_template.yaml: |
    log:
      stdout: true
      level: warn

    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            pluginName: postgres12
            databaseName: temporal
            connectAddr: "postgres:5432"
            connectProtocol: tcp
            user: "{{ env "TEMPORAL_DB_USER" }}"
            password: "{{ env "TEMPORAL_DB_PASSWORD" }}"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: "1h"
        visibility:
          sql:
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: "postgres:5432"
            connectProtocol: tcp
            user: "{{ env "TEMPORAL_DB_USER" }}"
            password: "{{ env "TEMPORAL_DB_PASSWORD" }}"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: "1h"

    global:
      membership:
        maxJoinDuration: 30s
      metrics:
        prometheus:
          framework: tally
          listenAddress: 0.0.0.0:9090

    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933

      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934

      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935

      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939

    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: active
      currentClusterName: active
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: frontend
          rpcAddress: 127.0.0.1:7233

    dcRedirectionPolicy:
      policy: noop
      toDC: ""

    archival:
      history:
        state: disabled
      visibility:
        state: disabled

    namespaceDefaults:
      archival:
        history:
          state: disabled
        visibility:
          state: disabled

---
# ── Temporal — ServiceAccount ─────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-temporal
  namespace: revelation-srs
  annotations:
    openbao.org/role: "srs-temporal"

---
# ── Temporal — Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-temporal
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-temporal
    app.kubernetes.io/component: workflow-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-temporal
        app.kubernetes.io/component: workflow-engine
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-temporal"
        vault.hashicorp.com/agent-inject-secret-db: "kv/data/srs/temporal-db"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "kv/data/srs/temporal-db" -}}
          {{ .Data.data.username }}
          {{ .Data.data.password }}
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: srs-temporal
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: temporal-schema-setup
          image: ghcr.io/revelation-srs/temporal-schema:latest
          command:
            - /bin/sh
            - -c
            - |
              export TEMPORAL_DB_USER="$(sed -n '1p' /vault/secrets/db | tr -d '[:space:]')"
              export TEMPORAL_DB_PASSWORD="$(sed -n '2p' /vault/secrets/db | tr -d '[:space:]')"
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres \
                --port 5432 \
                --db temporal \
                --user "$TEMPORAL_DB_USER" \
                --password "$TEMPORAL_DB_PASSWORD" \
                setup-schema -v 0.0
              temporal-sql-tool \
                --plugin postgres12 \
                --ep postgres \
                --port 5432 \
                --db temporal \
                --user "$TEMPORAL_DB_USER" \
                --password "$TEMPORAL_DB_PASSWORD" \
                update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: temporal
          image: temporalio/temporal:1.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc-frontend
              containerPort: 7233
            - name: metrics
              containerPort: 9090
          command:
            - /bin/sh
            - -c
            - |
              export TEMPORAL_DB_USER="$(sed -n '1p' /vault/secrets/db | tr -d '[:space:]')"
              export TEMPORAL_DB_PASSWORD="$(sed -n '2p' /vault/secrets/db | tr -d '[:space:]')"
              exec temporal-server \
                --config /etc/temporal/config \
                start
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            grpc:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: srs-temporal-config
        - name: tmp
          emptyDir: {}

---
# ── Temporal — Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-temporal
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-temporal
    app.kubernetes.io/component: workflow-engine
spec:
  selector:
    app.kubernetes.io/name: srs-temporal
  ports:
    - name: grpc-frontend
      port: 7233
      targetPort: grpc-frontend
  type: ClusterIP

---
# ── Temporal UI — Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-temporal-ui
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-temporal-ui
    app.kubernetes.io/component: workflow-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-temporal-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-temporal-ui
        app.kubernetes.io/component: workflow-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.31
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: srs-temporal:7233
            - name: TEMPORAL_CORS_ORIGINS
              value: ""   # UI accessed via internal ingress only
            - name: TEMPORAL_AUTH_ENABLED
              value: "false"   # secured by cluster network policy + ingress auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

---
# ── Temporal UI — Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-temporal-ui
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-temporal-ui
    app.kubernetes.io/component: workflow-ui
spec:
  selector:
    app.kubernetes.io/name: srs-temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
