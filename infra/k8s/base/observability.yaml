---
# ── Observability Stack ───────────────────────────────────────────────────────
#
# This manifest deploys the Revelation SRS observability stack:
#   Prometheus — metrics collection
#   Grafana     — dashboards and alerting
#   Loki        — log aggregation
#   Promtail    — log shipping (DaemonSet)
#   Tempo       — distributed traces (OTel OTLP receiver)
#
# For production, the Grafana community Kubernetes monitoring stack (kube-prom-stack)
# is recommended as an alternative:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prom-stack prometheus-community/kube-prometheus-stack -n monitoring
#
# IMPORTANT: All PersistentVolumeClaims below require a default StorageClass
# to be configured in the cluster.

---
# ── Prometheus — ConfigMap ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: revelation-srs
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster: revelation-srs

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []   # configure alertmanager endpoint in overlay

    scrape_configs:
      - job_name: srs-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [revelation-srs]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: nats-monitoring
        static_configs:
          - targets: [srs-nats:8222]

      - job_name: temporal-metrics
        static_configs:
          - targets: [srs-temporal:9090]

---
# ── Prometheus — Alert Rules ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: revelation-srs
data:
  srs-alerts.yml: |
    groups:
      - name: srs-api
        rules:
          - alert: ApiHighErrorRate
            expr: |
              sum(rate(http_request_duration_seconds_count{job="srs-api",status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{job="srs-api"}[5m])) > 0.01
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "API error rate > 1% for 5 minutes"
              description: "{{ $value | humanizePercentage }} of requests are errors"

          - alert: ApiHighLatency
            expr: |
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{job="srs-api"}[5m])) by (le)
              ) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "API p95 latency > 500ms"
              description: "p95 latency is {{ $value | humanizeDuration }}"

          - alert: DatabaseConnectionPoolSaturation
            expr: |
              db_connection_pool_in_use{job="srs-api"}
              / db_connection_pool_max{job="srs-api"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "DB connection pool > 80% utilised"

          - alert: NatsConsumerLag
            expr: nats_consumer_num_pending > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "NATS consumer lag > 1000 messages"

          - alert: TemporalWorkflowFailureRate
            expr: |
              increase(temporal_workflow_failed_total[10m]) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Temporal workflow failures in last 10 minutes"

          - alert: IntegrationDeadLetterQueueNonEmpty
            expr: nats_consumer_num_pending{consumer=~".*dead.*"} > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Integration dead-letter queue has pending messages"

          - alert: BackupStale
            expr: time() - srs_last_backup_timestamp_seconds > 90000   # 25h
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Last successful backup older than 25 hours"

          - alert: DemoRotationFailed
            expr: srs_demo_rotation_last_success_timestamp_seconds < (time() - 86400 * 2)
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Demo rotation has not succeeded in >2 days"

---
# ── Prometheus — Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-prometheus
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-prometheus
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: srs-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.enable-lifecycle
            - --web.enable-remote-write-receiver
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-prometheus
  namespace: revelation-srs

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: srs-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: srs-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: srs-prometheus
subjects:
  - kind: ServiceAccount
    name: srs-prometheus
    namespace: revelation-srs

---
apiVersion: v1
kind: Service
metadata:
  name: srs-prometheus
  namespace: revelation-srs
spec:
  selector:
    app.kubernetes.io/name: srs-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: revelation-srs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi

---
# ── Grafana — Deployment ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-grafana
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-grafana
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srs-grafana-secret
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_DOMAIN
              value: grafana.example.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: srs-grafana-provisioning

---
apiVersion: v1
kind: Service
metadata:
  name: srs-grafana
  namespace: revelation-srs
spec:
  selector:
    app.kubernetes.io/name: srs-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: revelation-srs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# ── Grafana — Datasource provisioning ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-grafana-provisioning
  namespace: revelation-srs
data:
  datasources/datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://srs-prometheus:9090
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: traceID
      - name: Loki
        type: loki
        uid: loki
        url: http://srs-loki:3100
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceId":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://srs-tempo:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          serviceMap:
            datasourceUid: prometheus

---
# ── Loki — Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-loki
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-loki
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-loki
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/loki/config.yaml]
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: srs-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-loki-config
  namespace: revelation-srs
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 90d
    compactor:
      retention_enabled: true

---
apiVersion: v1
kind: Service
metadata:
  name: srs-loki
  namespace: revelation-srs
spec:
  selector:
    app.kubernetes.io/name: srs-loki
  ports:
    - name: http
      port: 3100
      targetPort: http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: revelation-srs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi

---
# ── Promtail — DaemonSet ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: srs-promtail
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-promtail
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-promtail
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: srs-promtail
      securityContext:
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/promtail/config.yaml]
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: srs-promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-promtail
  namespace: revelation-srs

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: srs-promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: srs-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: srs-promtail
subjects:
  - kind: ServiceAccount
    name: srs-promtail
    namespace: revelation-srs

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-promtail-config
  namespace: revelation-srs
data:
  config.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://srs-loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
        pipeline_stages:
          - json:
              expressions:
                level: level
                traceId: traceId
                tenantId: tenantId
          - labels:
              level:
              traceId:
              tenantId:

---
# ── Grafana Tempo — Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-tempo
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-tempo
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-tempo
        app.kubernetes.io/component: observability
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:2.4.0
          imagePullPolicy: IfNotPresent
          args: [-config.file=/etc/tempo/config.yaml]
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: srs-tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-tempo-config
  namespace: revelation-srs
data:
  config.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 720h   # 30 days

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: revelation-srs
      storage:
        path: /var/tempo/generator
      processors: [service-graphs, span-metrics]

    overrides:
      metrics_generator_processors: [service-graphs, span-metrics]

---
apiVersion: v1
kind: Service
metadata:
  name: srs-tempo
  namespace: revelation-srs
spec:
  selector:
    app.kubernetes.io/name: srs-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: revelation-srs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
