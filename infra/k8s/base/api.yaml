---
# ── ServiceAccount ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-api
  namespace: revelation-srs
  annotations:
    # OpenBao Kubernetes auth role binds to this service account
    openbao.org/role: "srs-api"
---
# ── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-api
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-api
        app.kubernetes.io/component: api
      annotations:
        # ── OpenBao agent injector ──────────────────────────────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-api"
        # Injects PostgreSQL dynamic credentials
        vault.hashicorp.com/agent-inject-secret-db: "database/creds/srs-api"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "database/creds/srs-api" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@postgres:5432/srs
          {{- end }}
        # Injects NATS NKey credentials
        vault.hashicorp.com/agent-inject-secret-nats: "kv/data/srs/nats"
        vault.hashicorp.com/agent-inject-template-nats: |
          {{- with secret "kv/data/srs/nats" -}}
          {{ .Data.data.nkey_seed }}
          {{- end }}
        # BL-184: the secret key for the public verification IP hash
        # (at least 32 characters; rotate it yearly with the log retention).
        vault.hashicorp.com/agent-inject-secret-public-verify: "kv/data/srs/api/public-verify"
        vault.hashicorp.com/agent-inject-template-public-verify: |
          {{- with secret "kv/data/srs/api/public-verify" -}}
          {{ .Data.data.ip_key }}
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: srs-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/revelation-srs/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # Malware scanning of uploads (ADR-030).
            - name: DOCUMENT_SCANNER
              value: clamd
            - name: CLAMD_HOST
              value: srs-clamav
            - name: CLAMD_PORT
              value: "3310"
            - name: PORT
              value: "3000"
            # Tokens: Keycloak RS256 only (HS256 refuses to start outside
            # development and test). The issuer is Keycloak's public URL.
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak:8080/realms/srs/protocol/openid-connect/certs
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: srs-api-config
                  key: KEYCLOAK_ISSUER
            - name: NATS_URL
              value: nats://srs-nats:4222
            - name: TEMPORAL_ADDRESS
              value: srs-temporal:7233
            # Live Temporal execution (ADR-024). Off by default; overlays turn it
            # on once a worker is running. The rollout flag
            # workflow.temporal-execution then picks which new reviews use it.
            - name: TEMPORAL_EXECUTION_ENABLED
              value: "false"
            - name: TEMPORAL_NAMESPACE
              value: srs-production
            - name: TEMPORAL_TASK_QUEUE
              value: srs-workflows
            - name: ATTENDANCE_API_URL
              value: http://srs-attendance:3004
            # Believe X-Forwarded-For only from private-network peers. The
            # allow-ingress-to-api network policy admits only ingress-nginx
            # (and monitoring), and ingress-nginx with its default
            # use-forwarded-headers off sets the header from the real
            # connection. A hop count would be ignored by Fastify.
            - name: TRUST_PROXY
              value: uniquelocal
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: srs-api-config
                  key: CORS_ORIGINS
            # Secrets are read from OpenBao-injected files at startup
            # DATABASE_URL is sourced from /vault/secrets/db
            # NATS_NKEY_SEED is sourced from /vault/secrets/nats
            # PUBLIC_VERIFY_IP_KEY is sourced from /vault/secrets/public-verify
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="$(cat /vault/secrets/db)"
              export NATS_NKEY_SEED="$(cat /vault/secrets/nats)"
              export PUBLIC_VERIFY_IP_KEY="$(cat /vault/secrets/public-verify)"
              exec node dist/main.js
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        # Spread replicas across nodes, and zones where the cluster has them (BL-012, readiness 2.4).
        # ScheduleAnyway: a small cluster still schedules every replica.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-api
---
# ── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-api-config
  namespace: revelation-srs
data:
  CORS_ORIGINS: "https://portal.example.com,https://admin.example.com"
  # Keycloak's public realm URL: the `iss` of every token the services accept.
  KEYCLOAK_ISSUER: "https://auth.example.com/realms/srs"
---
# ── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-api
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: srs-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: srs-api
  namespace: revelation-srs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: srs-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
