---
# ── ServiceAccount ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-api
  namespace: revelation-srs
  annotations:
    # OpenBao Kubernetes auth role binds to this service account
    openbao.org/role: "srs-api"

---
# ── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-api
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-api
        app.kubernetes.io/component: api
      annotations:
        # ── OpenBao agent injector ──────────────────────────────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-api"
        # Injects PostgreSQL dynamic credentials
        vault.hashicorp.com/agent-inject-secret-db: "database/creds/srs-api"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "database/creds/srs-api" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@postgres:5432/srs
          {{- end }}
        # Injects Keycloak client secret
        vault.hashicorp.com/agent-inject-secret-keycloak: "kv/data/srs/keycloak"
        vault.hashicorp.com/agent-inject-template-keycloak: |
          {{- with secret "kv/data/srs/keycloak" -}}
          {{ .Data.data.client_secret }}
          {{- end }}
        # Injects NATS NKey credentials
        vault.hashicorp.com/agent-inject-secret-nats: "kv/data/srs/nats"
        vault.hashicorp.com/agent-inject-template-nats: |
          {{- with secret "kv/data/srs/nats" -}}
          {{ .Data.data.nkey_seed }}
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: srs-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/revelation-srs/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: srs
            - name: KEYCLOAK_CLIENT_ID
              value: srs-api
            - name: NATS_URL
              value: nats://srs-nats:4222
            - name: TEMPORAL_ADDRESS
              value: srs-temporal:7233
            - name: WELLBEING_URL
              value: http://srs-wellbeing:3002
            - name: ATTENDANCE_API_URL
              value: http://srs-attendance:3004
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: srs-api-config
                  key: ALLOWED_ORIGINS
            # Secrets are read from OpenBao-injected files at startup
            # DATABASE_URL is sourced from /vault/secrets/db
            # KEYCLOAK_CLIENT_SECRET is sourced from /vault/secrets/keycloak
            # NATS_NKEY_SEED is sourced from /vault/secrets/nats
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="$(cat /vault/secrets/db)"
              export KEYCLOAK_CLIENT_SECRET="$(cat /vault/secrets/keycloak)"
              export NATS_NKEY_SEED="$(cat /vault/secrets/nats)"
              exec node dist/index.js
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60

---
# ── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-api-config
  namespace: revelation-srs
data:
  ALLOWED_ORIGINS: "https://portal.example.com,https://admin.example.com"

---
# ── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-api
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: srs-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  type: ClusterIP

---
# ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: srs-api
  namespace: revelation-srs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: srs-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
