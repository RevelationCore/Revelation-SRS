---
# ── Temporal Worker — ServiceAccount ─────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-worker
  namespace: revelation-srs
  annotations:
    openbao.org/role: "srs-worker"
---
# ── Temporal Worker — Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-worker
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-worker
        app.kubernetes.io/component: worker
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-worker"
        vault.hashicorp.com/agent-inject-secret-db: "database/creds/srs-worker"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "database/creds/srs-worker" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@postgres:5432/srs
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-nats: "kv/data/srs/nats"
        vault.hashicorp.com/agent-inject-template-nats: |
          {{- with secret "kv/data/srs/nats" -}}
          {{ .Data.data.nkey_seed }}
          {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
    spec:
      serviceAccountName: srs-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # The worker is the API image with a different entry point: it needs
          # the same domain services, rules and database access (ADR-024).
          image: ghcr.io/revelation-srs/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9466
          env:
            - name: NODE_ENV
              value: production
            # Background jobs may run longer than a request (BL-011): 5 minutes.
            - name: DB_STATEMENT_TIMEOUT_MS
              value: "300000"
            - name: TEMPORAL_ADDRESS
              value: srs-temporal:7233
            - name: TEMPORAL_EXECUTION_ENABLED
              value: "true"
            - name: TEMPORAL_NAMESPACE
              value: srs-production
            - name: TEMPORAL_TASK_QUEUE
              value: srs-workflows
            - name: NATS_URL
              value: nats://srs-nats:4222
            - name: WORKER_HEALTH_PORT
              value: "9466"
            # The worker builds the API app, which refuses HS256 outside
            # development and test (it validates no tokens itself).
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak:8080/realms/srs/protocol/openid-connect/certs
            - name: RECONCILE_INTERVAL_MS
              value: "15000"
            - name: OTEL_SERVICE_NAME
              value: srs-api
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="$(cat /vault/secrets/db)"
              export NATS_NKEY_SEED="$(cat /vault/secrets/nats)"
              exec node dist/worker.js
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Ready only while the worker is polling its task queue.
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        # Spread replicas across nodes, and zones where the cluster has them (BL-012, readiness 2.4).
        # ScheduleAnyway: a small cluster still schedules every replica.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-worker
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-worker
---
# ── VLE Adapter — ServiceAccount ──────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-vle-adapter
  namespace: revelation-srs
  annotations:
    openbao.org/role: "srs-vle-adapter"
---
# ── VLE Adapter — ConfigMap ───────────────────────────────────────────────────
# Per deployment: the overlay (or the operator) replaces both values. The
# placeholders are not UUIDs, so an unconfigured connector refuses to start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-vle-adapter-config
  namespace: revelation-srs
data:
  TENANT_ID: "set-per-deployment"
  INTEGRATION_REGISTRATION_ID: "set-per-deployment"
---
# ── VLE Adapter — Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-vle-adapter
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-vle-adapter
    app.kubernetes.io/component: adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-vle-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-vle-adapter
        app.kubernetes.io/component: adapter
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-vle-adapter"
        vault.hashicorp.com/agent-inject-secret-db: "database/creds/srs-adapter"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "database/creds/srs-adapter" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@postgres:5432/srs
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-nats: "kv/data/srs/nats"
        vault.hashicorp.com/agent-inject-template-nats: |
          {{- with secret "kv/data/srs/nats" -}}
          {{ .Data.data.nkey_seed }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-vle: "kv/data/srs/vle-adapter"
        vault.hashicorp.com/agent-inject-template-vle: |
          {{- with secret "kv/data/srs/vle-adapter" -}}
          {{ .Data.data.api_key }}
          {{- end }}
    spec:
      serviceAccountName: srs-vle-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vle-adapter
          image: ghcr.io/revelation-srs/vle-adapter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3003"
            - name: NATS_URL
              value: nats://srs-nats:4222
            # The tenant and integration registration this connector serves:
            # set per deployment in srs-vle-adapter-config (checked as UUIDs at start).
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: srs-vle-adapter-config
                  key: TENANT_ID
            - name: INTEGRATION_REGISTRATION_ID
              valueFrom:
                configMapKeyRef:
                  name: srs-vle-adapter-config
                  key: INTEGRATION_REGISTRATION_ID
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="$(cat /vault/secrets/db)"
              export NATS_NKEY_SEED="$(cat /vault/secrets/nats)"
              export VLE_API_TOKEN="$(cat /vault/secrets/vle)"
              exec node dist/main.js
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        # Spread replicas across nodes, and zones where the cluster has them (BL-012, readiness 2.4).
        # ScheduleAnyway: a small cluster still schedules every replica.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-vle-adapter
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-vle-adapter
---
# ── VLE Adapter — Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-vle-adapter
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-vle-adapter
    app.kubernetes.io/component: adapter
spec:
  selector:
    app.kubernetes.io/name: srs-vle-adapter
  ports:
    - name: http
      port: 3003
      targetPort: http
  type: ClusterIP
---
# ── Wellbeing Module — ServiceAccount ────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srs-wellbeing
  namespace: revelation-srs
  annotations:
    openbao.org/role: "srs-wellbeing"
---
# ── Wellbeing Module — Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs-wellbeing
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-wellbeing
    app.kubernetes.io/component: module
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-wellbeing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-wellbeing
        app.kubernetes.io/component: module
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "srs-wellbeing"
        vault.hashicorp.com/agent-inject-secret-db: "database/creds/srs-wellbeing"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "database/creds/srs-wellbeing" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@postgres:5432/srs
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-nats: "kv/data/srs/nats"
        vault.hashicorp.com/agent-inject-template-nats: |
          {{- with secret "kv/data/srs/nats" -}}
          {{ .Data.data.nkey_seed }}
          {{- end }}
        # ADR-029: the private key the wellbeing service signs its client
        # assertions with, as a file (re-read when OpenBao re-renders it).
        vault.hashicorp.com/agent-inject-secret-srs-client-key: "kv/data/srs/wellbeing/service-client"
        vault.hashicorp.com/agent-inject-file-srs-client-key: "srs-client-key"
        vault.hashicorp.com/agent-inject-template-srs-client-key: |
          {{- with secret "kv/data/srs/wellbeing/service-client" -}}
          {{ .Data.data.private_key_pem }}
          {{- end }}
    spec:
      serviceAccountName: srs-wellbeing
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wellbeing
          image: ghcr.io/revelation-srs/wellbeing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: WELLBEING_PORT
              value: "3002"
            - name: NATS_URL
              value: nats://srs-nats:4222
            # Tokens: Keycloak RS256 only (HS256 refuses to start outside
            # development and test). The issuer is Keycloak's public URL.
            - name: KEYCLOAK_JWKS_URL
              value: http://keycloak:8080/realms/srs/protocol/openid-connect/certs
            # Hand-offs to core as the wellbeing service (ADR-029): real clients,
            # a signed client assertion per tenant, the key from OpenBao.
            - name: SRS_API_URL
              value: http://srs-api:3000
            - name: WELLBEING_SRS_CLIENTS
              value: http
            - name: WELLBEING_SRS_CLIENT_AUTH
              value: private_key_jwt
            - name: WELLBEING_SRS_CLIENT_KEY_FILE
              value: /vault/secrets/srs-client-key
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: srs-api-config
                  key: KEYCLOAK_ISSUER
          command:
            - /bin/sh
            - -c
            - |
              export DATABASE_URL="$(cat /vault/secrets/db)"
              export NATS_NKEY_SEED="$(cat /vault/secrets/nats)"
              exec node dist/main.js
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        # Spread replicas across nodes, and zones where the cluster has them (BL-012, readiness 2.4).
        # ScheduleAnyway: a small cluster still schedules every replica.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-wellbeing
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: srs-wellbeing
---
# ── Wellbeing Module — Service ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-wellbeing
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-wellbeing
    app.kubernetes.io/component: module
spec:
  selector:
    app.kubernetes.io/name: srs-wellbeing
  ports:
    - name: http
      port: 3002
      targetPort: http
  type: ClusterIP
---
