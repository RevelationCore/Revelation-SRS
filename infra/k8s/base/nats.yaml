---
# ── NATS — ConfigMap ──────────────────────────────────────────────────────────
# Production NATS JetStream configuration.
# For a clustered deployment, set cluster.routes to list peer pod addresses.
# This single-node config is suitable for staging; production should use
# a 3-node cluster (see overlays/production/nats-cluster-patch.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: srs-nats-config
  namespace: revelation-srs
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    accounts {
      SRS {
        jetstream: enabled
        users: [
          { nkey: $SRS_NKEY_PUBLIC }
        ]
      }
    }

    system_account: SRS

    no_auth_user: ""

    log_time: true
    debug: false
    trace: false

---
# ── NATS — Headless Service (for StatefulSet DNS) ─────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-nats-headless
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-nats
    app.kubernetes.io/component: messaging
spec:
  selector:
    app.kubernetes.io/name: srs-nats
  clusterIP: None
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: cluster
      port: 6222
      targetPort: cluster
    - name: monitor
      port: 8222
      targetPort: monitor

---
# ── NATS — Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: srs-nats
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-nats
    app.kubernetes.io/component: messaging
spec:
  selector:
    app.kubernetes.io/name: srs-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
  type: ClusterIP

---
# ── NATS — StatefulSet ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: srs-nats
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-nats
    app.kubernetes.io/component: messaging
spec:
  serviceName: srs-nats-headless
  replicas: 1   # override to 3 in production overlay
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-nats
        app.kubernetes.io/component: messaging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          args:
            - -c
            - /etc/nats/nats.conf
          env:
            - name: SRS_NKEY_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: srs-nats-nkey
                  key: public
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: srs-nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi

---
# ── JetStream stream: declared here, not left to the app (BL-012, readiness 2.4) ──
# The API creates SRS_EVENTS only if it is missing (development and tests),
# with the server's defaults: one replica, no limits. This Job declares the
# stream with explicit settings and is idempotent: it creates the stream, or
# brings an existing one into line. STREAM_REPLICAS is 1 here (one NATS
# node) and 3 in the production overlay. Re-applying the manifests reruns it
# once the finished Job has been cleaned up (ttlSecondsAfterFinished).
apiVersion: batch/v1
kind: Job
metadata:
  name: srs-nats-streams
  namespace: revelation-srs
  labels:
    app.kubernetes.io/name: srs-nats-streams
    app.kubernetes.io/part-of: revelation-srs
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-nats-streams
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: declare-streams
          image: natsio/nats-box:0.14.5
          env:
            - name: STREAM_REPLICAS
              value: "1"
            - name: NATS_URL
              value: nats://srs-nats:4222
            - name: NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: srs-nats-nkey
                  key: seed
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              printf '%s' "$NKEY_SEED" > /tmp/nkey && chmod 600 /tmp/nkey
              SETTINGS="--subjects srs.> --storage file --replicas $STREAM_REPLICAS --retention limits --max-age 30d --max-bytes 8GB --discard old --dupe-window 2m"
              if nats --server "$NATS_URL" --nkey /tmp/nkey stream info SRS_EVENTS >/dev/null 2>&1; then
                nats --server "$NATS_URL" --nkey /tmp/nkey stream edit SRS_EVENTS $SETTINGS --force
              else
                nats --server "$NATS_URL" --nkey /tmp/nkey stream add SRS_EVENTS $SETTINGS --defaults
              fi
              nats --server "$NATS_URL" --nkey /tmp/nkey stream info SRS_EVENTS --json | head -c 400
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
