apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay — local cluster (e.g., kind, minikube, k3d)
# OpenBao secrets injection is disabled; env vars are sourced from ConfigMaps/Secrets directly.
# Single replicas; no HPA active; minimal resource limits.

namespace: revelation-srs-dev

# No namePrefix (BL-372): the overlay has its own namespace, and a prefix
# renames Services without rewriting the hostnames in environment values
# (http://srs-api:3000, nats://srs-nats:4222, CLAMD_HOST=srs-clamav), so the
# services could not reach each other. check:k8s now checks those hostnames.

patches:
  # Reduce API replicas to 1 for development
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: srs-api
      spec:
        replicas: 1
    target: { kind: Deployment, name: srs-api }
  # Reduce portal/admin to 1 replica
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: srs-portal
      spec:
        replicas: 1
    target: { kind: Deployment, name: srs-portal }
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: srs-admin
      spec:
        replicas: 1
    target: { kind: Deployment, name: srs-admin }
  # Disable OpenBao agent injection in development — use direct env Secret instead
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: srs-api
      spec:
        template:
          metadata:
            annotations:
              vault.hashicorp.com/agent-inject: "false"
          spec:
            containers:
              - name: api
                command: [node, dist/main.js]
                envFrom:
                  - secretRef:
                      name: srs-dev-secrets
    target: { kind: Deployment, name: srs-api }
  # Looser resource limits for dev
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: srs-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
    target: { kind: Deployment, name: srs-api }

# Override images to use locally-built tags
images:
  # ClamAV 1.5.5 by digest (ADR-030); refresh at least monthly so signature downloads stay allowed.
  - name: clamav/clamav
    digest: sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
  - name: ghcr.io/revelation-srs/api
    newTag: dev
  - name: ghcr.io/revelation-srs/portal
    newTag: dev
  - name: ghcr.io/revelation-srs/admin
    newTag: dev
  - name: ghcr.io/revelation-srs/vle-adapter
    newTag: dev
  - name: ghcr.io/revelation-srs/wellbeing
    newTag: dev
  - name: ghcr.io/revelation-srs/attendance
    newTag: dev
resources:
  - ../../base

# Development secrets placeholder (operator must create before apply)
# kubectl create secret generic srs-dev-secrets -n revelation-srs-dev \
#   --from-literal=DATABASE_URL=postgresql://srs:srs@postgres:5432/srs \
#   --from-literal=JWT_SECRET=dev-secret \
#   --from-literal=KEYCLOAK_CLIENT_SECRET=dev-keycloak-secret \
#   --from-literal=NATS_URL=nats://srs-nats:4222
