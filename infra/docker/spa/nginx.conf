# Main nginx configuration for the admin and portal images. Unprivileged
# (Kubernetes runs them as UID 101 with every capability dropped and a
# read-only root): port 8080, and pid and temporary files in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  # The pod's DNS resolver, written at start by the entrypoint, so the BFF's
  # name is looked up per request and nginx starts even before it resolves.
  include /tmp/nginx-resolver*.conf;
  include /etc/nginx/http.d/*.conf;
}
