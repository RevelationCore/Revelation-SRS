# Cache-Control by path, set once at server level below. (An add_header in
# a location block would drop every server-level header, the security
# headers included, so locations set none.)
map $uri $srs_cache_control {
  ~*\.(js|css|woff2?|ttf|eot|ico|png|svg)$  "public, immutable";
  default                                   "no-cache, no-store, must-revalidate";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers (enterprise readiness plan, item 1.9). The ingress
  # repeats some of these; they are here too so the image is safe behind any
  # proxy.
  #
  # CSP: scripts only from this origin (the build emits no inline script).
  # style-src allows 'unsafe-inline' because the dialog's scroll lock
  # (react-style-singleton) injects a <style> element at runtime. connect-src
  # is 'self' alone: the app calls only its BFF on this origin, which holds
  # the tokens (ADR-026).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  # HSTS takes effect only over HTTPS (the TLS proxy in front); harmless over HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $srs_cache_control always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The backend-for-frontend (ADR-026), looked up per request. Bodies up to
  # 25 MB (evidence uploads), and no buffering, for the notification stream.
  location /bff/ {
    set $bff_upstream http://srs-admin-bff:3010;
    proxy_pass $bff_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 25m;
  }

  # Back-channel logout is for Keycloak on the cluster network, never the browser.
  location = /bff/auth/backchannel-logout {
    return 404;
  }

  # SPA routing — all paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed static assets aggressively (Cache-Control from the map above)
  location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg)$ {
    expires 1y;
  }
}
