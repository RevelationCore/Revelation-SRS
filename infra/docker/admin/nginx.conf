# Cache-Control by path, set once at server level below. (An add_header in
# a location block would drop every server-level header, the security
# headers included, so locations set none.)
map $uri $srs_cache_control {
  ~*\.(js|css|woff2?|ttf|eot|ico|png|svg)$  "public, immutable";
  default                                   "no-cache, no-store, must-revalidate";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Security headers (enterprise readiness plan, item 1.9). The ingress
  # repeats some of these; they are here too so the image is safe behind any
  # proxy.
  #
  # CSP: scripts only from this origin (the build emits no inline script).
  # style-src allows 'unsafe-inline' because the dialog's scroll lock
  # (react-style-singleton) injects a <style> element at runtime. The API,
  # wellbeing API and Keycloak are on other HTTPS origins chosen per
  # deployment, so connect-src allows https:; narrow it to those hosts where
  # they are known. Tokens stay in localStorage for now (item 1.9 deferred).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  # HSTS takes effect only over HTTPS (the TLS proxy in front); harmless over HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $srs_cache_control always;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA routing — all paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed static assets aggressively (Cache-Control from the map above)
  location ~* \.(js|css|woff2?|ttf|eot|ico|png|svg)$ {
    expires 1y;
  }
}
